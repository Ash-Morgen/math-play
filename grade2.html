<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0ca678">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="二上闯关">
<title>二年级上 · 同步闯关（沪教版）</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="grade2.css">
</head>
<body>

<div id="app">

  <!-- ========== 首页 ========== -->
  <section id="view-home" class="view active">
    <header class="hero">
      <div class="logo">📐</div>
      <h1>二年级上 · 同步闯关</h1>
      <p class="sub">沪教版 · 按教材单元编排</p>
    </header>

    <div id="unitList"><!-- JS 注入：按单元分组 --></div>

    <div class="card stats-card">
      <div class="stat"><span class="stat-num" id="homeStars">0</span><span class="stat-lbl">总星星</span></div>
      <div class="stat"><span class="stat-num" id="homeDays">0</span><span class="stat-lbl">练习天数</span></div>
      <div class="stat"><span class="stat-num" id="homeAcc">—</span><span class="stat-lbl">正确率</span></div>
    </div>

    <button class="btn btn-ghost" id="btnParent">家长报告</button>
    <a class="btn btn-ghost" href="index.html">← 回到数感训练</a>
  </section>

  <!-- ========== 单元内页 ========== -->
  <section id="view-unit" class="view">
    <header class="unit-bar">
      <button class="icon-btn" id="btnUnitBack" aria-label="返回">←</button>
      <div class="unit-title-text" id="unitTitle">单元</div>
      <div class="star-counter">⭐ <span id="unitStars">0</span></div>
    </header>
    <div id="modeList"></div>
    <div class="card stats-card" id="unitStats"></div>
  </section>

  <!-- ========== 答题 ========== -->
  <section id="view-quiz" class="view">
    <header class="quiz-bar">
      <button class="icon-btn" id="btnQuit" aria-label="退出">✕</button>
      <div class="progress-wrap"><div class="progress" id="progress"></div></div>
      <div class="star-counter">⭐ <span id="quizStars">0</span></div>
    </header>

    <div class="quiz-body">
      <div class="stage-tag" id="stageTag">乘法与除法</div>
      <div class="question" id="question"></div>
    </div>

    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
  </section>

  <!-- ========== 结算 ========== -->
  <section id="view-result" class="view">
    <div class="result-card">
      <div class="result-emoji" id="resultEmoji">🎉</div>
      <h2 id="resultTitle">真棒！</h2>
      <div class="result-stars" id="resultStars">⭐⭐⭐</div>
      <p class="result-sub" id="resultSub"></p>
      <button class="btn btn-primary" id="btnAgain">再来一轮</button>
      <button class="btn btn-ghost" id="btnBackHome">回到首页</button>
    </div>
  </section>

  <!-- ========== 家长报告 ========== -->
  <section id="view-parent" class="view">
    <header class="hero small"><h1>家长报告</h1></header>
    <div class="card" id="parentStats"></div>
    <div class="card" id="parentDaily"></div>
    <div class="card" id="parentModes"></div>
    <button class="btn btn-ghost" id="btnParentBack">返回</button>
    <button class="btn btn-danger" id="btnReset">清空记录</button>
  </section>

</div>

<script src="drag.js"></script>
<script src="drag-extra.js"></script>
<script src="match.js"></script>
<script src="grade2.js"></script>
</body>
</html>
