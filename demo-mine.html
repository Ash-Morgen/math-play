<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b2118">
<title>宝石矿工 · 玩法原型</title>
<style>
:root{--g:#22c55e;--g2:#16a34a;--amber:#ffb020;--red:#ef4444;--ink:#f5f5f4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;padding:12px;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(circle at 50% 0%,#4a3a2a 0%,#241c14 70%);
  color:var(--ink);user-select:none;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  min-height:100%;overscroll-behavior:none;
}
.bar{
  width:100%;max-width:430px;display:flex;justify-content:space-between;
  align-items:center;gap:8px;font-size:13px;font-weight:800;
}
.bar .pill{background:rgba(255,255,255,.1);padding:7px 13px;border-radius:99px;white-space:nowrap}
.bar .pill b{color:var(--amber);font-size:15px}
.bar .time.low b{color:var(--red);animation:blink .7s infinite}
@keyframes blink{50%{opacity:.35}}

.goal{
  width:100%;max-width:430px;text-align:center;
  background:linear-gradient(135deg,#f59e0b,#d97706);
  border-radius:18px;padding:12px;box-shadow:0 6px 20px rgba(245,158,11,.35);
}
.goal .t{font-size:12px;font-weight:800;opacity:.9}
.goal .n{font-size:30px;font-weight:900;line-height:1.1;letter-spacing:1px}

.board{
  width:100%;max-width:430px;display:grid;gap:8px;
  grid-template-columns:repeat(4,1fr);
}
.rock{
  aspect-ratio:1;border:none;border-radius:16px;cursor:pointer;
  font-family:inherit;font-size:clamp(17px,5vw,24px);font-weight:900;
  color:#3f2f1f;
  background:linear-gradient(160deg,#cbb89a,#a89275);
  box-shadow:0 4px 0 #7d6a4f,inset 0 2px 6px rgba(255,255,255,.35);
  display:flex;align-items:center;justify-content:center;
  transition:transform .1s,box-shadow .1s,filter .15s;
  touch-action:manipulation;
}
.rock:active{transform:translateY(2px);box-shadow:0 2px 0 #7d6a4f}
.rock.sel{
  background:linear-gradient(160deg,#5eead4,#14b8a6);color:#04332c;
  box-shadow:0 0 0 4px #14b8a6,0 4px 0 #0f766e;transform:translateY(2px) scale(1.04);
}
.rock.gem{background:linear-gradient(160deg,#5eead4,#22d3ee);box-shadow:0 0 22px #22d3ee}
.rock.bad{background:linear-gradient(160deg,#fca5a5,#ef4444);animation:shk .38s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.rock.empty{background:rgba(255,255,255,.05);box-shadow:none;cursor:default}

.tip{width:100%;max-width:430px;text-align:center;font-size:12.5px;color:#c7b299;line-height:1.6;min-height:20px}
.combo{
  position:fixed;left:50%;top:26%;transform:translate(-50%,0);
  font-size:30px;font-weight:900;color:var(--amber);text-shadow:0 3px 0 #000,0 0 20px rgba(255,176,32,.7);
  pointer-events:none;animation:cb .8s ease forwards;z-index:9;
}
@keyframes cb{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}
  30%{opacity:1;transform:translate(-50%,0) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-40px) scale(1)}}

.mask{
  position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;
  align-items:center;justify-content:center;padding:22px;z-index:20;
}
.mbox{
  background:#2f2418;border:2px solid #5c4a33;border-radius:22px;padding:24px 20px;
  width:100%;max-width:330px;text-align:center;color:var(--ink);
}
.mbox h2{margin:0 0 6px;font-size:21px}
.mbox p{margin:0 0 16px;font-size:14px;color:#c7b299;line-height:1.7}
.mbox button{
  width:100%;padding:14px;border:none;border-radius:14px;
  background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;
  font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;
}
.mbox button:active{transform:scale(.97)}
.stars{font-size:26px;letter-spacing:5px;margin:4px 0 10px}
</style>
</head>
<body>

<div class="bar">
  <span class="pill">💎 宝石 <b id="score">0</b></span>
  <span class="pill" id="comboBox">连击 <b id="combo">0</b></span>
  <span class="pill time" id="timeBox">⏱ <b id="time">90</b>s</span>
</div>

<div class="goal">
  <div class="t">点两块石头，让它们的和正好是</div>
  <div class="n" id="goal">10</div>
</div>

<div class="board" id="board"></div>
<div class="tip" id="tip">点一下选中，再点另一块凑出目标数</div>

<script>
(function(){
  var TARGETS = [10, 20, 50, 100];
  var LEVEL_TIME = 75;

  var stage = 0, target = TARGETS[0], score = 0, combo = 0, timeLeft = LEVEL_TIME;
  var grid = [], sel = [], locked = false, timer = null;

  var $board = document.getElementById('board');
  var $goal = document.getElementById('goal');
  var $score = document.getElementById('score');
  var $combo = document.getElementById('combo');
  var $time = document.getElementById('time');
  var $tip = document.getElementById('tip');
  var $timeBox = document.getElementById('timeBox');

  var COLS = 4, ROWS = 4;

  function ri(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
  function shuffle(a){ for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }

  /* 生成一个数：偏向"凑起来有教学意义"的数 */
  function makeNum(){
    var r = Math.random();
    if (target <= 20){
      if (r < .45) return ri(1, 9);                    // 个位数，练凑十
      if (r < .8) return ri(1, 9) * 10 / 10 + 0;       // 同上
      return ri(2, 9);
    }
    if (r < .3) return ri(1, 9) * 10;                  // 整十
    if (r < .55) return ri(1, 9) * 10 + ri(1, 9);      // 两位
    if (r < .75) return ri(2, 9) * 10;
    return ri(11, target - 1);
  }

  /* 塞入足量"能配对"的数字，保证有解 */
  function buildGrid(){
    var n = ROWS * COLS;
    var arr = new Array(n);
    var pairs = Math.max(3, Math.floor(n / 4));
    var used = {};
    var idxPool = shuffle(Array.from({length:n}, function(_,i){return i;}));
    var k = 0;
    for (var p = 0; p < pairs && k + 1 < n; p++){
      var a = ri(1, target - 1);
      var b = target - a;
      if (b < 1) continue;
      var ia = idxPool[k++], ib = idxPool[k++];
      arr[ia] = a; arr[ib] = b;
      used[a] = 1; used[b] = 1;
    }
    for (var i = 0; i < n; i++){
      if (arr[i] === undefined) arr[i] = makeNum();
    }
    grid = arr;
  }

  function render(){
    $board.innerHTML = '';
    grid.forEach(function(v, i){
      var b = document.createElement('button');
      b.className = 'rock' + (sel.indexOf(i) >= 0 ? ' sel' : '');
      b.textContent = v === 0 ? '' : v;
      if (v === 0) b.classList.add('empty');
      b.addEventListener('click', function(){ tap(i); });
      $board.appendChild(b);
    });
    $goal.textContent = target;
    $score.textContent = score;
    $combo.textContent = combo;
  }

  function tap(i){
    if (locked || grid[i] === 0) return;
    var at = sel.indexOf(i);
    if (at >= 0){ sel.splice(at,1); render(); return; }
    sel.push(i);
    render();
    if (sel.length === 2) check();
  }

  function check(){
    locked = true;
    var a = grid[sel[0]], b = grid[sel[1]];
    if (a + b === target){
      // 命中
      combo++;
      var gain = 10 * combo;
      score += gain;
      $score.textContent = score;      // 立即回馈，别等重绘（爽感就靠这个即时性）
      $combo.textContent = combo;
      var cells = $board.children;
      sel.forEach(function(i){ grid[i] = 0; cells[i].classList.add('gem'); });
      if (combo >= 2) showCombo('连击 ×' + combo + '  +' + gain);
      $tip.textContent = a + ' + ' + b + ' = ' + target + '　💎 炸开啦！+' + gain;
      setTimeout(function(){
        sel = []; locked = false;
        refill();
        ensureSolvable();
        render();          // 必须先改数据再渲染，否则屏幕数字和实际数据不一致
      }, 420);
    } else {
      // 落空
      combo = 0;
      $combo.textContent = combo;      // 连击断了也要立刻看到
      var cells2 = $board.children;
      sel.forEach(function(i){ cells2[i].classList.add('bad'); });
      $tip.textContent = a + ' + ' + b + ' = ' + (a + b) + '，不是 ' + target + '，再想想';
      setTimeout(function(){
        sel = []; locked = false; render();
      }, 460);
    }
  }

  function refill(){
    for (var i = 0; i < grid.length; i++) if (grid[i] === 0) grid[i] = makeNum();
  }

  /* 保证盘面还有解：没有配对就塞一对进去 */
  function ensureSolvable(){
    var cnt = {};
    grid.forEach(function (v) { if (v) cnt[v] = (cnt[v] || 0) + 1; });
    var ok = false;
    for (var i = 0; i < grid.length && !ok; i++) {
      var v = grid[i];
      if (!v) continue;
      var need = target - v;
      if (need >= 1 && cnt[need] !== undefined) {
        if (need === v ? cnt[need] >= 2 : true) ok = true;
      }
    }
    if (!ok) {
      var a = ri(1, target - 1), b = target - a;
      var i1 = ri(0, grid.length - 1), i2 = ri(0, grid.length - 1);
      while (i2 === i1) i2 = ri(0, grid.length - 1);
      grid[i1] = a; grid[i2] = b;
    }
  }

  function showCombo(txt){
    var d = document.createElement('div');
    d.className = 'combo';
    d.textContent = txt;
    document.body.appendChild(d);
    setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, 850);
  }

  function tick(){
    timeLeft--;
    $time.textContent = timeLeft;
    $timeBox.classList.toggle('low', timeLeft <= 15);
    if (timeLeft <= 0) nextStage();
  }

  function nextStage(){
    clearInterval(timer);
    locked = true;
    stage++;
    if (stage >= TARGETS.length){ finish(); return; }
    target = TARGETS[stage];
    timeLeft = LEVEL_TIME;
    sel = [];
    buildGrid(); render();
    $time.textContent = timeLeft;
    $timeBox.classList.remove('low');
    var d = document.createElement('div');
    d.className = 'mask';
    d.innerHTML = '<div class="mbox"><h2>⛏️ 挖到更深处！</h2>' +
      '<p>新目标：凑出 <b>' + target + '</b><br>宝石 ' + score + ' 颗</p>' +
      '<button id="goon">继续挖</button></div>';
    document.body.appendChild(d);
    d.querySelector('#goon').addEventListener('click', function(){
      document.body.removeChild(d);
      locked = false;
      timer = setInterval(tick, 1000);
    });
  }

  function finish(){
    var stars = score >= 600 ? 3 : score >= 300 ? 2 : score >= 120 ? 1 : 0;
    var d = document.createElement('div');
    d.className = 'mask';
    d.innerHTML = '<div class="mbox"><h2>🎉 收工啦</h2>' +
      '<div class="stars">' + '⭐'.repeat(stars) + '☆'.repeat(3-stars) + '</div>' +
      '<p>一共挖到 <b>' + score + '</b> 颗宝石</p>' +
      '<button id="again">再挖一次</button></div>';
    document.body.appendChild(d);
    d.querySelector('#again').addEventListener('click', function(){ location.reload(); });
  }

  buildGrid();
  render();
  timer = setInterval(tick, 1000);
})();
</script>
</body>
</html>
